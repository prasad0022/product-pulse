services:
  api:
    build: .
    container_name: product-pulse-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      PRODUCT_PULSE_LLM: ${PRODUCT_PULSE_LLM:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:4173,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro
      - ./api:/app/api:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    container_name: product-pulse-ui
    ports:
      - "4173:4173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
